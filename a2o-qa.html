<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2O 知識問答助手</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#0ea5e9; --accent-soft:#0c4a6e; --accent-bg:#082f49;
    --user-bubble:#0e7490; --bot-bubble:#273449; --danger:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.6 "Noto Sans TC","PingFang TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .app{
    width:100%; max-width:880px; height:min(92vh,760px); background:var(--panel);
    border:1px solid var(--line); border-radius:24px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  /* Header */
  header{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; background:var(--panel)}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:22px}
  .title{flex:1}
  .title h1{font-size:1.05rem}
  .title p{font-size:.8rem;color:var(--muted)}
  .pill{font-size:.72rem;background:var(--accent-bg);color:var(--accent);padding:.15rem .6rem;border-radius:999px;border:1px solid var(--accent-soft)}
  /* Key bar */
  .keybar{display:flex;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel2)}
  .keybar label{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .keybar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:.45rem .8rem;border-radius:10px;font:inherit}
  .keybar button{background:var(--accent);border:0;color:#fff;padding:.45rem 1rem;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .keybar button:hover{filter:brightness(1.1)}
  .keybar .hint{font-size:.72rem;color:var(--muted)}
  /* Messages */
  .msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
  .msg{max-width:78%;padding:12px 16px;border-radius:var(--radius);font-size:.95rem;line-height:1.65;white-space:pre-wrap;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--user-bubble);border-bottom-right-radius:6px}
  .msg.bot{align-self:flex-start;background:var(--bot-bubble);border-bottom-left-radius:6px}
  .msg .role{display:block;font-size:.7rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .msg.user .role{color:#a5f3fc}
  .msg.error{background:#450a0a;border:1px solid var(--danger)}
  .typing{display:inline-flex;gap:5px;align-items:center}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .src{display:block;font-size:.72rem;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  /* Input */
  .composer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel)}
  .composer textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:.6rem .9rem;border-radius:12px;font:inherit;min-height:44px;max-height:120px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer button{background:var(--accent);border:0;border-radius:12px;width:48px;color:#fff;font-size:18px;cursor:pointer}
  .composer button:hover{filter:brightness(1.15)}
  .composer button:disabled{opacity:.4;cursor:not-allowed}
  .composer .sendicon{line-height:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🧑‍💼</div>
    <div class="title">
      <h1>A2O 知識問答助手</h1>
      <p>新人須知 · 退換貨 · 報價流程</p>
    </div>
    <span class="pill" id="kState">未連接</span>
  </header>

  <div class="keybar">
    <label>Groq API Key</label>
    <input type="password" id="apiKey" placeholder="gsk_…">
    <button id="connBtn">連接</button>
    <span class="hint">key 留在本頁，不會上傳</span>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="composer">
    <textarea id="input" placeholder="問 A2O 的事，例如：業務可以給到幾折？…" rows="1"></textarea>
    <button id="send" title="送出">➤</button>
  </div>
</div>

<script>
// ===== 知識庫（情境三_新人須知）=====
const KB = {
  "新人須知 2026 版": `# 新人須知 2026版（現行，生效日 2026-03-01，取代 2024版）

1. 上班與請假：上班 08:30–17:30，午休 12:00–13:00。請假在人資系統線上申請，前一天下班前送出；臨時病假當天 09:00 前打給主管。
2. 客戶詢問怎麼接：一般詢問 1 個工作天內回覆；客訴 4 個工作小時內先回第一封，說明已收到、誰負責、何時再回。所有詢問登記在案件庫，寫清楚客戶、產品、狀態。
3. 報價權限：業務可以給到牌價 95 折。低於 95 折，或單筆金額超過新台幣 50 萬元，要業務主管核准。海外報價一律經業務主管。詳細看報價流程。
4. 退換貨：收貨 14 天內可申請，詳細看退換貨辦法。
5. 對外承諾：交期、認證、保固只能照公司文件講，文件沒寫的不要自己答應。免費到府、賠償、折讓、「保證」這類承諾，一律要主管核准，不可以先答應客戶。產品對外說法以「產品母稿」為準。
6. 客訴回覆三段式：1 先接住情緒（謝謝告知、造成困擾很抱歉）；2 再說明處理（需要客戶提供什麼、我們會怎麼做）；3 最後留窗口（誰負責、什麼時候再回）。
7. 找誰：規格、認證、品質→品保課 王課長；價格、交期、報價核准→業務主管 劉經理；退換貨、出貨→物流課 江組長。`,

  "退換貨辦法": `# 退換貨辦法（版次 2026-03，負責：物流課 江組長）

1. 期限：收貨 14 天內提出申請。
2. 可以退換：未拆封、未安裝→可退貨，全額退款。產品瑕疵（例如滴水、鍍層剝落）→換新品，運費公司負擔。少零件→補寄缺少零件，不用寄回整組。
3. 不能退換：已安裝、非產品瑕疵（例如買錯尺寸）；人為損壞、未依說明書安裝。
4. 包裝破損：簽收時發現外箱破損，當場拍照，3 天內通報業務或客服；超過 3 天由物流課判斷。
5. 誰能答應客戶：第 2 節以內的處理客服可直接答應；第 2 節以外的處理（免費到府、賠償）要主管核准。`,

  "報價流程": `# 報價流程（版次 2026-03，負責：業務主管 劉經理）

1. 步驟：確認客戶要的型號、數量、交貨地點、希望時間 → 查牌價表算出報價 → 折扣在權限內業務直接出報價單；折扣超過權限送業務主管核准後再出 → 報價單寄出後在案件庫把狀態改「已回覆」。
2. 折扣權限：業務：牌價 95 折以內。低於 95 折，或單筆超過新台幣 50 萬元→業務主管核准。海外報價一律業務主管核准；涉及認證的一併給品保課確認。
3. 報價單：有效期 30 天。交期寫「訂單確認後由業務回覆」，不寫死日期。`,

  "新人須知 2024版（已停用）": `# 新人須知 2024版（已停用，被 2026版 取代，不要當作現行規定）

舊規定：上班時間同 2026。請假填紙本假單交給主管簽名。一般詢問盡量當天回覆；客訴 24 小時內回覆；詢問記在業務自己的 Excel。報價：業務可給到牌價 9 折；低於 9 折或單筆超過 100 萬要業務主管核准。退換貨：收貨 7 天內。`,
};

// Groq 設定
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "llama-3.1-8b-instant";

let apiKey = "";

function buildSystem(){
  // 排除停用版
  const active = Object.entries(KB).filter(([k]) => !k.includes("停用"));
  const kbText = active.map(([k,v]) => `【文件：${k}】\n${v}`).join("\n\n");
  return `你是 A2O（鹿溪衛浴，虛構）的客服/業務知識助手。只能根據下面提供的公司文件回答，不要憑空捏造。

${kbText}

回答規則：
- 只根據文件內容回答；文件沒寫的就說「這在文件裡沒有寫，建議詢問主管」。
- 若問題提到 2024 舊規定，要指出 2026 版已取代 2024 版。
- 回答簡潔、口語、像真人客服。
- 涉及權限/承諾時，明確提醒需要主管核准。`;
}

const $ = s=>document.querySelector(s);
const msgs = $('#msgs');
function addMsg(role, html){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML = `<span class="role">${role==='user'?'你':'A2O助手'}</span>${html}`;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
  return d;
}
function addTyping(){
  const d=document.createElement('div'); d.className='msg bot';
  d.innerHTML='<span class="role">A2O助手</span><span class="typing"><i></i><i></i><i></i></span>';
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 連接/輸入 key
$('#connBtn').onclick = () => {
  const v = $('#apiKey').value.trim();
  if(!v.startsWith('gsk_')){ addMsg('bot','<span class="error" style="color:#f87171">請輸入有效的 Groq API key（開頭 gsk_）。</span>'); return; }
  apiKey = v;
  $('#kState').textContent = '已連接';
  $('#kState').style.color = '#4ade80';
  addMsg('bot','✅ 已連接 Groq。向我問 A2O 新人須知的事吧。');
};

// 送出
async function ask(question){
  if(!apiKey){ addMsg('bot','<span style="color:#f87171">請先在上方輸入 Groq API key 並按「連接」。</span>'); return; }
  const typing = addTyping();
  try{
    const r = await fetch(GROQ_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body: JSON.stringify({
        model: MODEL,
        temperature: 0.3,
        messages:[
          {role:'system', content: buildSystem()},
          {role:'user', content: question}
        ]
      })
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    typing.remove();
    addMsg('bot', esc(j.choices[0].message.content));
  }catch(e){
    typing.remove();
    addMsg('bot', `<span class="error" style="color:#f87171">呼叫 Groq 失敗：${esc(e.message)}</span>`);
  }
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
function send(){
  const q = $('#input').value.trim();
  if(!q) return;
  addMsg('user', esc(q));
  $('#input').value='';
  ask(q);
}

// 開場
addMsg('bot','👋 你好！我是 A2O 新人須知助手。\n可以問我：業務可以給幾折？退貨期限多久？客訴怎麼回覆？……\n\n請先在上方「 Groq API key 並按「連接」。');
</script>
</body>
</html>
