<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2O 知識問答助手</title>
<style>
  :root{
    --accent:#0ea5e9; --accent-d:#0284c7;
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --ink:#e2e8f0; --muted:#94a3b8;
    --user:#0e7490; --bot-soft:#273449;
    --danger:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.6 "Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex}
  .app{width:100%;max-width:860px;margin:0 auto;height:100vh;display:flex;flex-direction:column}

  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--panel)}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:22px}
  .title{flex:1}
  .title h1{font-size:1.05rem}
  .title p{font-size:.8rem;color:var(--muted)}

  .keybar{display:flex;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel2);flex-wrap:wrap}
  .keybar label{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .keybar input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:.45rem .8rem;border-radius:10px;font:inherit}
  .keybar button{background:var(--accent);border:0;color:#fff;padding:.45rem 1.1rem;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .keybar button:hover{background:var(--accent-d)}
  .keybar .ok{font-size:.8rem;color:#4ade80;white-space:nowrap}
  .keybar .doc{font-size:.78rem;color:var(--muted)}

  .msgs{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78%;padding:12px 16px;border-radius:16px;font-size:.95rem;line-height:1.65;white-space:pre-wrap;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px}
  .msg.bot{align-self:flex-start;background:var(--bot-soft);border:1px solid var(--line);border-bottom-left-radius:6px}
  .msg .role{display:block;font-size:.7rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .msg .err{color:var(--danger)}
  .typing{display:inline-flex;gap:5px;align-items:center}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .composer{display:flex;gap:10px;padding:14px 26px;border-top:1px solid var(--line);background:var(--panel)}
  .composer textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:.6rem .9rem;border-radius:12px;font:inherit;min-height:46px;max-height:130px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer button{background:var(--accent);border:0;border-radius:12px;width:50px;color:#fff;font-size:18px;cursor:pointer}
  .composer button:hover{background:var(--accent-d)}
  .composer button:disabled{opacity:.4;cursor:not-allowed}

  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1200;display:flex;align-items:center;justify-content:center}
  #overlay.hidden{display:none}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;width:400px;max-width:calc(100vw - 40px);box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .modal h2{font-size:1.1rem;margin-bottom:6px}
  .modal p{font-size:.85rem;color:var(--muted);margin-bottom:16px}
  .modal input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:.6rem .9rem;border-radius:10px;font:inherit;margin-bottom:12px}
  .modal .row{display:flex;gap:10px}
  .modal button{flex:1;background:var(--accent);border:0;color:#fff;padding:.55rem;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  .modal button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .modal .need{color:var(--danger);font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🧑‍💼</div>
    <div class="title">
      <h1>A2O 知識問答助手</h1>
      <p>新人須知 · 退換貨 · 報價流程</p>
    </div>
  </header>

  <div class="keybar">
    <label>Groq API Key</label>
    <input type="password" id="apiKey" placeholder="gsk_…">
    <button id="keyBtn">連接</button>
    <span class="ok" id="keyOk" style="display:none">✓ 已連接</span>
    <span class="doc">模型：openai/gpt-oss-20b</span>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="composer">
    <textarea id="input" placeholder="問 A2O 的事，例如：業務可以給幾折？" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="modal">
    <h2>🔑 輸入 Groq API Key</h2>
    <p>這是知識問答助手，需輸入有效金鑰才能使用。金鑰只存在你的瀏覽器。</p>
    <input type="password" id="modalKey" placeholder="gsk_…" autofocus>
    <div class="row">
      <button id="modalSave">開始使用</button>
      <button class="ghost" id="modalCancel">稍後</button>
    </div>
    <div class="need" id="modalNeed" style="display:none">請輸入有效的 Groq API Key（開頭 gsk_）。</div>
  </div>
</div>

<script>
const KB = {
  "新人須知 2026 版": `# 新人須知 2026版（現行，生效日 2026-03-01，取代 2024版）
1. 上班與請假：上班 08:30–17:30，午休 12:00–13:00。請假在人資系統線上申請，前一天下班前送出；臨時病假當天 09:00 前打給主管。
2. 客戶詢問怎麼接：一般詢問 1 個工作天內回覆；客訴 4 個工作小時內先回第一封，說明已收到、誰負責、何時再回。所有詢問登記在案件庫。
3. 報價權限：業務可給到牌價 95 折。低於 95 折，或單筆超過新台幣 50 萬元，要業務主管核准。海外報價一律經業務主管。
4. 退換貨：收貨 14 天內可申請。
5. 對外承諾：交期、認證、保固只能照公司文件講，文件沒寫的不要自己答應。免費到府、賠償、折讓、「保證」這類承諾，一律要主管核准。
6. 客訴回覆三段式：1 先接住情緒；2 再說明處理；3 最後留窗口。
7. 找誰：規格/認證/品質→品保課 王課長；價格/交期/報價核准→業務主管 劉經理；退換貨/出貨→物流課 江組長。`,
  "退換貨辦法": `# 退換貨辦法（版次 2026-03）
1. 期限：收貨 14 天內提出申請。
2. 可以退換：未拆封未安裝→退貨全額退款；產品瑕疵（滴水、鍍層剝落）→換新品，運費公司負擔；少零件→補寄，不用寄回整組。
3. 不能退換：已安裝非瑕疵（買錯尺寸）；人為損壞、未依說明書安裝。
4. 包裝破損：簽收當場拍照，3 天內通報；超過 3 天由物流課判斷。
5. 誰能答應：第 2 節以內客服可直接答應；以外（免費到府、賠償）要主管核准。`,
  "報價流程": `# 報價流程（版次 2026-03）
1. 步驟：確認型號/數量/交貨地點/時間→查牌價表→折扣在權限內業務直接出報價單；超過權限送主管核准→寄出後案件庫改「已回覆」。
2. 折扣權限：業務牌價 95 折以內；低於 95 折或單筆超 50 萬→業務主管核准；海外一律業務主管核准，涉及認證併給品保課。
3. 報價單：有效期 30 天；交期寫「訂單確認後由業務回覆」，不寫死日期。`,
  "新人須知 2024版（已停用）": `# 新人須知 2024版（已停用，被 2026版 取代，勿當現行規定）`,
};

const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "openai/gpt-oss-20b";   // 開發者可用模型

let apiKey = localStorage.getItem("a2o_groq_key") || "";

function buildSystem(){
  const active = Object.entries(KB).filter(([k]) => !k.includes("停用"));
  const kbText = active.map(([k,v]) => `【文件：${k}】\n${v}`).join("\n\n");
  return `你是 A2O（鹿溪衛浴，虛構）的客服/業務知識助手。只能根據下面提供的公司文件回答。

${kbText}

回答規則：
- 只根據文件回答；文件沒寫就說「文件裡沒寫，建議詢問主管」。
- 若提到 2024 舊規定，要指出 2026 版已取代。
- 回答簡潔、口語、像真人客服。
- 涉及權限/承諾時，明確提醒需主管核准。`;
}

const $ = s=>document.querySelector(s);
const msgs = $('#msgs');

function showModal(){ $('#overlay').classList.remove('hidden'); $('#modalKey').focus(); }
function hideModal(){ $('#overlay').classList.add('hidden'); }
$('#modalCancel').onclick = hideModal;
$('#modalSave').onclick = () => {
  const v = $('#modalKey').value.trim();
  if(!v.startsWith('gsk_')){ $('#modalNeed').style.display='block'; return; }
  apiKey = v; localStorage.setItem("a2o_groq_key", v);
  $('#apiKey').value = v; hideModal(); setKeyUi(); welcome();
};
$('#keyBtn').onclick = () => {
  const v = $('#apiKey').value.trim();
  if(!v.startsWith('gsk_')){ addMsg('bot','<span class="err">金鑰格式不對（須 gsk_ 開頭）。</span>'); return; }
  apiKey = v; localStorage.setItem("a2o_groq_key", v); setKeyUi(); welcome();
};
function setKeyUi(){ $('#keyOk').style.display = apiKey ? 'inline' : 'none'; }

function addMsg(role, html){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML = `<span class="role">${role==='user'?'你':'A2O助手'}</span>${html}`;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
}
function addTyping(){
  const d=document.createElement('div'); d.className='msg bot';
  d.innerHTML='<span class="role">A2O助手</span><span class="typing"><i></i><i></i><i></i></span>';
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function welcome(){ if(msgs.children.length===0) addMsg('bot','👋 你好！我是 A2O 新人須知助手。可以問我：業務給幾折？退貨期限？客訴怎麼回？'); }

async function ask(question){
  if(!apiKey){ showModal(); return; }
  const typing = addTyping();
  try{
    const r = await fetch(GROQ_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body: JSON.stringify({ model:MODEL, temperature:0.3,
        messages:[{role:'system',content:buildSystem()},{role:'user',content:question}] })
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    typing.remove(); addMsg('bot', esc(j.choices[0].message.content));
  }catch(e){ typing.remove(); addMsg('bot', `<span class="err">呼叫 Groq 失敗：${esc(e.message)}</span>`); }
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
function send(){
  const q = $('#input').value.trim(); if(!q) return;
  addMsg('user', esc(q)); $('#input').value=''; ask(q);
}

setKeyUi();
welcome();
if(!apiKey) showModal();
</script>
</body>
</html>
